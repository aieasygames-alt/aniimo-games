name: Aniimo maintenance audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: aniimo-maintenance-audit
  cancel-in-progress: true

jobs:
  audit-and-index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production checks
        run: npm run check:monitoring

      - name: Upload monitoring report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aniimo-monitoring-report
          path: monitoring-report.md
          if-no-files-found: warn

      - name: Submit current sitemap URLs to IndexNow
        run: npm run submit:indexnow
